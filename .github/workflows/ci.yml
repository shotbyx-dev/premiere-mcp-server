name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg # beat-detection tests decode via ffmpeg
      - run: npm run build
      - run: npm test
        env:
          PREMIERE_MCP_TOKEN: ci-placeholder-token-0123456789abcdef
